[project]
name = "incognita"
version = "0.1.0"
description = ""
authors = [
    {name = "momonala", email = "mnalavadi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata",
    "flask>=3.0.0,<4.0.0",
    "geopandas>=1.0.0,<2.0.0",
    "joblib>=1.0.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3,<3.0.0",
    "plotly>=6.0.0,<7.0.0",
    "psutil",
    "pycountry",
    "pydantic>=2.14.1",
    "pydeck>=0.0.0,<1.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.0.0,<3.0.0",
    "rich>=15.0.0",
    "schedule>=1.2.2",
    "spyglass",
    "tqdm>=4.0.0,<5.0.0",
    "typer>=0.27.3",
]

[tool.config]
data_api_port = 5003
dashboard_port = 5004
flights_map_filename = "static/flights_pydeck.html"
gps_map_filename = "static/gps_pydeck.html"
visited_map_filename = "static/visited_pydeck.html"
default_location = [52.52, 13.405]
# Spyglass observability (local server: uv run spyglass serve)
spyglass_host = "localhost:5013"
spyglass_dashboard_url = "https://spyglass.mnalavadi.org/dashboard/incognita"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incognita"]

[project.scripts]
app = "incognita.app:main"
config = "incognita.config:main"
data-api = "incognita.data_api:main"
refresh-db = "incognita.scripts.refresh_db:main"
health = "incognita.scripts.health_step_duplicates:main"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.uv.sources]
spyglass = { git = "https://github.com/momonala/spyglass.git", rev = "main" }

[tool.black]
line-length = 110
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100", "PLW1510"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true
